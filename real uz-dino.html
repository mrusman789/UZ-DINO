<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>UZ Dino Run</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}


/* =========================
   GAME WRAPPER
========================= */

#screen {
    width: 100%;
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #111;
}


/* =========================
   FIXED GAME AREA
========================= */

#game {
    position: relative;

    width: min(100vw, 1100px);
    height: min(56.25vw, 620px);

    min-height: 300px;

    overflow: hidden;

    background: #f7f7f7;

    border-radius: 14px;

    box-shadow:
        0 0 0 2px #333,
        0 20px 60px rgba(0,0,0,0.45);
}


/* =========================
   TOP UI
========================= */

#brand {
    position: absolute;

    top: 20px;
    left: 25px;

    font-size: 20px;
    font-weight: 800;

    letter-spacing: 1px;

    color: #222;

    z-index: 20;
}


#scoreBox {
    position: absolute;

    top: 20px;
    right: 25px;

    text-align: right;

    color: #222;

    z-index: 20;
}


#score {
    font-size: 18px;
    font-weight: bold;
}


#best {
    margin-top: 3px;

    font-size: 12px;

    color: #777;
}


/* =========================
   GROUND
========================= */

#ground {
    position: absolute;

    left: 0;
    bottom: 55px;

    width: 100%;
    height: 4px;

    background: #222;

    z-index: 5;
}


/* =========================
   DINO
========================= */

#dino {
    position: absolute;

    left: 100px;
    bottom: 59px;

    width: 42px;
    height: 52px;

    background: #222;

    border-radius:
        7px
        7px
        3px
        3px;

    z-index: 10;
}


/* Dino head */

#dino::before {
    content: "";

    position: absolute;

    right: -14px;
    top: 0;

    width: 25px;
    height: 24px;

    background: #222;

    border-radius: 5px;
}


/* Eye */

#dino::after {
    content: "";

    position: absolute;

    right: -7px;
    top: 6px;

    width: 6px;
    height: 6px;

    background: white;

    border-radius: 50%;
}


/* Dino legs */

.leg {
    position: absolute;

    bottom: -9px;

    width: 7px;
    height: 13px;

    background: #222;
}

#leg1 {
    left: 7px;
}

#leg2 {
    right: 7px;
}


/* =========================
   JUMP
========================= */

.jumping {
    animation:
        dinoJump
        0.65s
        ease-out;
}


@keyframes dinoJump {

    0% {
        bottom: 59px;
    }

    50% {
        bottom: 235px;
    }

    100% {
        bottom: 59px;
    }

}


/* =========================
   CACTUS
========================= */

.cactus {
    position: absolute;

    width: 22px;
    height: 50px;

    background: #222;

    border-radius:
        5px
        5px
        2px
        2px;

    z-index: 8;
}


.cactus::before {
    content: "";

    position: absolute;

    left: -10px;
    top: 19px;

    width: 13px;
    height: 8px;

    background: #222;

    border-radius: 5px;
}


.cactus::after {
    content: "";

    position: absolute;

    right: -10px;
    top: 29px;

    width: 13px;
    height: 8px;

    background: #222;

    border-radius: 5px;
}


/* =========================
   CLOUDS
========================= */

.cloud {
    position: absolute;

    width: 75px;
    height: 22px;

    background: #ddd;

    border-radius: 20px;

    opacity: 0.8;

    z-index: 2;
}


.cloud::before {
    content: "";

    position: absolute;

    left: 12px;
    top: -12px;

    width: 30px;
    height: 30px;

    background: #ddd;

    border-radius: 50%;
}


.cloud::after {
    content: "";

    position: absolute;

    right: 8px;
    top: -15px;

    width: 35px;
    height: 35px;

    background: #ddd;

    border-radius: 50%;
}


/* =========================
   START SCREEN
========================= */

#startScreen {
    position: absolute;

    inset: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    flex-direction: column;

    background:
        linear-gradient(
            rgba(247,247,247,0.96),
            rgba(247,247,247,0.96)
        );

    z-index: 100;
}


#startScreen h1 {
    font-size: clamp(30px, 6vw, 58px);

    color: #222;

    letter-spacing: 2px;

    margin-bottom: 8px;
}


#startScreen p {
    color: #777;

    font-size: 14px;

    margin-bottom: 25px;
}


/* =========================
   BUTTON
========================= */

.mainButton {
    border: none;

    padding: 13px 32px;

    border-radius: 10px;

    background: #222;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition:
        transform 0.15s,
        background 0.15s;
}


.mainButton:hover {
    background: #444;
}


.mainButton:active {
    transform: scale(0.95);
}


/* =========================
   GAME OVER
========================= */

#gameOver {
    position: absolute;

    inset: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    flex-direction: column;

    background:
        rgba(247,247,247,0.96);

    z-index: 90;
}


#gameOver h1 {
    font-size: clamp(32px, 6vw, 55px);

    margin-bottom: 10px;

    color: #222;
}


#finalScore {
    color: #555;

    line-height: 1.7;

    text-align: center;

    margin-bottom: 20px;
}


/* =========================
   MOBILE JUMP BUTTON
========================= */

#jumpButton {
    position: absolute;

    right: 18px;
    bottom: 18px;

    width: 90px;
    height: 48px;

    border: none;

    border-radius: 10px;

    background: #222;

    color: white;

    font-size: 14px;

    font-weight: bold;

    z-index: 40;

    cursor: pointer;
}


/* =========================
   MOBILE LAYOUT
========================= */

@media (max-width: 700px) {

    #screen {
        align-items: center;
    }


    #game {

        width: 94vw;

        height: calc(94vw * 0.5625);

        min-height: 0;

        border-radius: 10px;

    }


    #brand {

        top: 12px;
        left: 14px;

        font-size: 14px;

    }


    #scoreBox {

        top: 12px;
        right: 14px;

    }


    #score {
        font-size: 13px;
    }


    #best {
        font-size: 9px;
    }


    #dino {

        left: 9%;

        width: 32px;
        height: 40px;

        bottom: 59px;

        transform:
            scale(0.78);

        transform-origin:
            bottom left;

    }


    #jumpButton {

        width: 75px;
        height: 40px;

        right: 12px;
        bottom: 10px;

        font-size: 12px;

    }

}


/* =========================
   VERY SMALL PHONES
========================= */

@media (max-width: 380px) {

    #game {
        width: 96vw;
        height: calc(96vw * 0.5625);
    }


    #brand {
        font-size: 12px;
    }


    #score {
        font-size: 11px;
    }


    #best {
        font-size: 8px;
    }

}

</style>
</head>


<body>


<div id="screen">


<div id="game">


<!-- BRAND -->

<div id="brand">
    UZ • DINO RUN
</div>


<!-- SCORE -->

<div id="scoreBox">

    <div id="score">
        SCORE: 00000
    </div>

    <div id="best">
        BEST: 00000
    </div>

</div>


<!-- DINO -->

<div id="dino">

    <div
        class="leg"
        id="leg1">
    </div>

    <div
        class="leg"
        id="leg2">
    </div>

</div>


<!-- GROUND -->

<div id="ground"></div>


<!-- MOBILE BUTTON -->

<button id="jumpButton">
    JUMP
</button>


<!-- START SCREEN -->

<div id="startScreen">

    <h1>
        UZ DINO RUN
    </h1>

    <p>
        SPACE / ↑ to Jump
    </p>

    <button
        class="mainButton"
        id="startButton">

        START GAME

    </button>

</div>


</div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const game =
    document.getElementById("game");

const dino =
    document.getElementById("dino");

const scoreDisplay =
    document.getElementById("score");

const bestDisplay =
    document.getElementById("best");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const jumpButton =
    document.getElementById("jumpButton");


/* =========================
   VARIABLES
========================= */

let score = 0;

let bestScore =
    Number(
        localStorage.getItem(
            "UZ_DINO_BEST"
        )
    ) || 0;

let gameRunning = false;

let jumping = false;

let cactusSpeed = 5;

let cactusTimer = null;

let scoreTimer = null;

let difficultyTimer = null;

let cloudTimer = null;


/* =========================
   DISPLAY BEST
========================= */

bestDisplay.textContent =
    "BEST: " +
    String(bestScore)
        .padStart(5, "0");


/* =========================
   SOUNDS
========================= */

const jumpSound =
    new Audio(
        "https://actions.google.com/sounds/v1/cartoon/jump.ogg"
    );

const hitSound =
    new Audio(
        "https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"
    );


function playSound(sound) {

    sound.currentTime = 0;

    sound.play().catch(
        () => {}
    );

}


/* =========================
   JUMP
========================= */

function jump() {

    if (
        !gameRunning ||
        jumping
    ) {
        return;
    }


    jumping = true;


    playSound(
        jumpSound
    );


    dino.classList.add(
        "jumping"
    );


    setTimeout(
        function() {

            dino.classList.remove(
                "jumping"
            );

            jumping = false;

        },
        650
    );

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space" ||
            event.code === "ArrowUp"
        ) {

            event.preventDefault();

            jump();

        }


        if (
            event.key.toLowerCase()
            === "r"
        ) {

            if (!gameRunning) {

                startGame();

            }

        }

    }
);


/* =========================
   MOBILE
========================= */

jumpButton.addEventListener(
    "click",
    jump
);


jumpButton.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        jump();

    }
);


/* =========================
   START BUTTON
========================= */

startButton.addEventListener(
    "click",
    startGame
);


/* =========================
   START GAME
========================= */

function startGame() {

    clearTimers();


    document
        .querySelectorAll(
            ".cactus, .cloud, #gameOver"
        )
        .forEach(
            element =>
                element.remove()
        );


    score = 0;

    cactusSpeed = 5;

    jumping = false;

    gameRunning = true;


    scoreDisplay.textContent =
        "SCORE: 00000";


    dino.classList.remove(
        "jumping"
    );


    startScreen.style.display =
        "none";


    startScore();

    startDifficulty();

    startCactusSpawner();

    startCloudSpawner();

}


/* =========================
   SCORE
========================= */

function startScore() {

    scoreTimer =
        setInterval(
            function() {

                if (
                    !gameRunning
                ) {
                    return;
                }


                score++;


                scoreDisplay.textContent =
                    "SCORE: " +
                    String(score)
                        .padStart(
                            5,
                            "0"
                        );

            },
            100
        );

}


/* =========================
   DIFFICULTY
========================= */

function startDifficulty() {

    difficultyTimer =
        setInterval(
            function() {

                if (
                    !gameRunning
                ) {
                    return;
                }


                cactusSpeed += 0.35;


                if (
                    cactusSpeed > 12
                ) {

                    cactusSpeed = 12;

                }

            },
            3000
        );

}


/* =========================
   CACTUS SPAWNER
========================= */

function startCactusSpawner() {

    cactusTimer =
        setInterval(
            function() {

                if (
                    gameRunning
                ) {

                    createCactus();

                }

            },
            1800
        );

}


/* =========================
   CREATE CACTUS
========================= */

function createCactus() {

    const cactus =
        document.createElement(
            "div"
        );


    cactus.className =
        "cactus";


    cactus.style.right =
        "-40px";


    cactus.style.bottom =
        "59px";


    game.appendChild(
        cactus
    );


    moveCactus(
        cactus
    );

}


/* =========================
   MOVE CACTUS
========================= */

function moveCactus(cactus) {

    let position = -40;


    const movement =
        setInterval(
            function() {

                if (
                    !gameRunning
                ) {

                    clearInterval(
                        movement
                    );

                    cactus.remove();

                    return;

                }


                position +=
                    cactusSpeed;


                cactus.style.right =
                    position + "px";


                if (
                    checkCollision(
                        dino,
                        cactus
                    )
                ) {

                    clearInterval(
                        movement
                    );

                    gameOver();

                    return;

                }


                if (
                    position >
                    game.clientWidth + 80
                ) {

                    clearInterval(
                        movement
                    );

                    cactus.remove();

                }

            },
            20
        );

}


/* =========================
   COLLISION
========================= */

function checkCollision(
    player,
    obstacle
) {

    const a =
        player.getBoundingClientRect();

    const b =
        obstacle.getBoundingClientRect();


    const padding = 7;


    return (

        a.left + padding
        <
        b.right - padding

        &&

        a.right - padding
        >
        b.left + padding

        &&

        a.top + padding
        <
        b.bottom - padding

        &&

        a.bottom - padding
        >
        b.top + padding

    );

}


/* =========================
   CLOUDS
========================= */

function startCloudSpawner() {

    cloudTimer =
        setInterval(
            createCloud,
            3500
        );

}


function createCloud() {

    if (
        !gameRunning
    ) {
        return;
    }


    const cloud =
        document.createElement(
            "div"
        );


    cloud.className =
        "cloud";


    cloud.style.right =
        "-100px";


    cloud.style.top =
        (
            40 +
            Math.random() *
            100
        ) + "px";


    game.appendChild(
        cloud
    );


    let position = -100;


    const movement =
        setInterval(
            function() {

                if (
                    !gameRunning
                ) {

                    clearInterval(
                        movement
                    );

                    cloud.remove();

                    return;

                }


                position += 1.5;


                cloud.style.right =
                    position + "px";


                if (
                    position >
                    game.clientWidth + 120
                ) {

                    clearInterval(
                        movement
                    );

                    cloud.remove();

                }

            },
            30
        );

}


/* =========================
   GAME OVER
========================= */

function gameOver() {

    if (
        !gameRunning
    ) {
        return;
    }


    gameRunning = false;


    playSound(
        hitSound
    );


    if (
        score >
        bestScore
    ) {

        bestScore =
            score;


        localStorage.setItem(
            "UZ_DINO_BEST",
            bestScore
        );


        bestDisplay.textContent =
            "BEST: " +
            String(bestScore)
                .padStart(
                    5,
                    "0"
                );

    }


    clearTimers();


    document
        .querySelectorAll(
            ".cactus"
        )
        .forEach(
            cactus =>
                cactus.remove()
        );


    const box =
        document.createElement(
            "div"
        );


    box.id =
        "gameOver";


    box.innerHTML = `

        <h1>
            GAME OVER
        </h1>

        <div id="finalScore">

            SCORE:
            ${score}

            <br>

            BEST:
            ${bestScore}

        </div>

        <button
            class="mainButton"
            id="restartButton">

            RESTART

        </button>

    `;


    game.appendChild(
        box
    );


    document
        .getElementById(
            "restartButton"
        )
        .addEventListener(
            "click",
            startGame
        );

}


/* =========================
   CLEAR TIMERS
========================= */

function clearTimers() {

    clearInterval(
        scoreTimer
    );

    clearInterval(
        cactusTimer
    );

    clearInterval(
        difficultyTimer
    );

    clearInterval(
        cloudTimer
    );

}


/* =========================
   INITIAL STATE
========================= */

gameRunning = false;

jumpButton.style.display =
    "block";

</script>

</body>
</html>
